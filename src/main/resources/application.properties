# uplink is a CLI: no banner, and only warnings from the framework so its output
# (or the TUI) is not interleaved with startup logs.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# Native binary: target/uplink (the name comes from <finalName> in pom.xml). Native
# builds take their suffix from this jar setting, so it drops "-runner" there too.
quarkus.package.jar.add-runner-suffix=false

# Native image: HTTPS for the crawler, and the Foreign Function & Memory API used by
# the TamboUI Panama terminal backend (its downcalls ship as reachability metadata).
quarkus.ssl.native=true
quarkus.native.additional-build-args=-H:+UnlockExperimentalVMOptions,-H:+ForeignAPISupport,-H:-UnlockExperimentalVMOptions,--enable-native-access=ALL-UNNAMED

# JVM mode: allow the Panama backend's native access without a warning.
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED
