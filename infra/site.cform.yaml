# aws cloudformation deploy --region us-east-1 --stack-name uplink-web --template-file infra/site.cform.yaml --parameter-overrides TenantId=uplink
#
# As prodbytes/dsp's site stacks: deploy in us-east-1, the region of the
# acm-cert stack of the same TenantId and of the zone stack, whose exports it
# imports. Deployed by scripts/deploy.sh (uplink-web for production,
# uplink-rc-web for the release candidate).

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  uplink in the browser: https://uplink.nu01.com (TenantId uplink) or
  https://rc.uplink.nu01.com (TenantId uplink-rc). One CloudFront
  distribution in front of a private S3 bucket (origin access control)
  holding the static site that `make web` builds (uplink-web/target/web/),
  with the certificate from the acm-cert stack of the same TenantId and
  alias records in the uplink-zone stack's zone.

Parameters:
  TenantId:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]*$"
    Description: Prefix for import/export names and the TenantId tag (uplink, uplink-rc)
  ZoneStackName:
    Type: String
    Default: uplink-zone
    Description: The stack of infra/zone.cform.yaml, whose zone holds the site's name

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: TenantId
          Value: !Ref TenantId

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution may read the bucket.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          # S3 answers 403 for a missing key unless ListBucket is allowed;
          # this lets unknown paths return 404 instead.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub
          - uplink in the browser (${DomainName})
          - DomainName:
              Fn::ImportValue: !Sub ${TenantId}-CertificateDomainName
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - Fn::ImportValue: !Sub ${TenantId}-CertificateDomainName
        ViewerCertificate:
          AcmCertificateArn:
            Fn::ImportValue: !Sub ${TenantId}-CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          # Gzip/Brotli for the HTML, JS and the WebAssembly module (~9 MB raw).
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
      Tags:
        - Key: TenantId
          Value: !Ref TenantId

  # Z2FDTNDATAQYW2 is the fixed hosted zone ID of every CloudFront distribution.
  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub ${ZoneStackName}-HostedZoneId
      Name:
        Fn::ImportValue: !Sub ${TenantId}-CertificateDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Fn::ImportValue: !Sub ${ZoneStackName}-HostedZoneId
      Name:
        Fn::ImportValue: !Sub ${TenantId}-CertificateDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Description: The site
    Value: !Sub
      - https://${DomainName}/
      - DomainName:
          Fn::ImportValue: !Sub ${TenantId}-CertificateDomainName
  SiteBucketName:
    Description: Upload the contents of uplink-web/target/web/ at the root
    Value: !Ref SiteBucket
    Export:
      Name: !Sub ${TenantId}-SiteBucketName
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref Distribution
    Export:
      Name: !Sub ${TenantId}-DistributionId
  DistributionDomainName:
    Description: CloudFront domain the alias records point at
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub ${TenantId}-DistributionDomainName
