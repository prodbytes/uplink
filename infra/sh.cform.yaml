AWSTemplateFormatVersion: '2010-09-09'
Description: >
  uplink-sh: https://sh.uplink.nu01.com, which serves the run script
  (scripts/run.sh) at every path, so
  `curl -fsSL https://sh.uplink.nu01.com | sh -s -- <url or directory>`
  runs uplink. One CloudFront distribution in front of a private S3 bucket
  and its certificate, validated in the apex zone nu01.com; the A/AAAA alias
  records of sh.uplink.nu01.com are in the nu01 repo (stack nu01-dns).
  Deploy in us-east-1 (CloudFront certificates must live there).

Parameters:
  DomainName:
    Type: String
    Default: sh.uplink.nu01.com
  ValidationZoneId:
    Type: String
    AllowedPattern: "^Z[A-Z0-9]+$"
    Description: >
      The Route 53 zone CloudFormation writes the certificate's validation
      CNAME in: the apex zone nu01.com (Z04838091YTBIM6PNI1XK), passed by
      scripts/deploy-sh.sh

Resources:
  # Changing DomainValidationOptions replaces the certificate, as the deploy
  # that moved validation from the uplink.nu01.com subzone (stack uplink-zone,
  # retired after it) to the apex zone nu01.com does: CloudFormation requests
  # a new certificate, validates it through the apex zone with the same
  # deterministic _<token> CNAME that the nu01 repo's
  # scripts/migrate-subzone.sh already copied there (CloudFormation UPSERTs
  # it), swaps it into the distribution below, then deletes the old one.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref ValidationZoneId

  ScriptBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  ScriptOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-script
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ScriptBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScriptBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution may read the bucket.
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ScriptBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ScriptBucket.Arn
              - !Sub ${ScriptBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Every path is the script: /, /run.sh, anything else.
  ScriptPathFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub ${AWS::StackName}-script-path
      AutoPublish: true
      FunctionConfig:
        Comment: Every URI to /run.sh
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = '/run.sh';
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub uplink run script (${DomainName})
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: script
            DomainName: !GetAtt ScriptBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ScriptOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: script
          # Plain http would hand the script over unprotected; refuse it
          # rather than redirect, so `curl http://… | sh` fails loudly.
          ViewerProtocolPolicy: https-only
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ScriptPathFunction.FunctionMetadata.FunctionARN

  # The A/AAAA alias records of sh.uplink.nu01.com used to be here, in the
  # uplink.nu01.com subzone; they are in the apex zone nu01.com now, owned by
  # the nu01 repo's nu01-dns stack (parameter UplinkShDistribution: the
  # DistributionDomainName output below).

Outputs:
  ScriptUrl:
    Value: !Sub https://${DomainName}/
  ScriptBucketName:
    Description: Upload scripts/run.sh as run.sh
    Value: !Ref ScriptBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront domain the alias records (nu01-dns stack) point at
    Value: !GetAtt Distribution.DomainName
