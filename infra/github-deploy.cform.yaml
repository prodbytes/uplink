AWSTemplateFormatVersion: '2010-09-09'
Description: >
  uplink-github-deploy: lets GitHub Actions deploy uplink in the browser
  (infra/acm-cert.cform.yaml and infra/site.cform.yaml, by scripts/deploy.sh).
  A production role that only *GA tag runs can assume, limited to the
  uplink-acm-cert and uplink-web stacks and the uplink.nu01.com records; and a
  release-candidate role for *RC* tag runs and manual runs from main, limited
  to the uplink-rc-acm-cert and uplink-rc-web stacks and the
  rc.uplink.nu01.com records. Also the execution roles of the sites' /health
  functions, so that the deploy roles only pass them and never create roles.
  Deployed by hand (see infra/README.md).

Parameters:
  GitHubRepository:
    Type: String
    Default: prodbytes/uplink
    Description: owner/name of the repository whose tag runs may deploy
  GitHubImmutableRepository:
    Type: String
    Default: prodbytes@288014477/uplink@1404673480
    Description: >
      The same repository in GitHub's immutable subject form,
      owner@<owner id>/name@<repository id>. The repository uses immutable
      OIDC subject claims (gh api repos/<owner>/<name>/actions/oidc/customization/sub
      shows use_immutable_subject and the sub_claim_prefix), so tokens say
      repo:<this>:ref:... rather than repo:owner/name:ref:...
  ZoneStackName:
    Type: String
    Default: uplink-zone
    Description: The stack of infra/zone.cform.yaml, whose zone holds the site records
  ProdDomainName:
    Type: String
    Default: uplink.nu01.com
  RcDomainName:
    Type: String
    Default: rc.uplink.nu01.com
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: true only when the account has no GitHub OIDC provider yet (presence-github-deploy created it)

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: uplink-github-deploy
      Description: Assumed by GitHub Actions on *GA tags to deploy uplink in the browser (uplink.nu01.com)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Only tag pushes whose name ends in GA (X.Y.Z-GA), in either
                # subject form (immutable IDs, or owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*GA
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*GA
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/uplink-acm-cert/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/uplink-web/*
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                Resource: '*'
              # The site bucket, named after the stack (uplink-web-sitebucket-...)
              - Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::uplink-web-*
                  - arn:aws:s3:::uplink-web-*/*
              - Effect: Allow
                Action: cloudfront:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                Resource: '*'
              - Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:GetHostedZone
                Resource: !Sub
                  - arn:${AWS::Partition}:route53:::hostedzone/${ZoneId}
                  - ZoneId:
                      Fn::ImportValue: !Sub ${ZoneStackName}-HostedZoneId
              # Records may change only for the site and its ACM validation
              # name (_<token>.uplink.nu01.com): never rc's or sh's.
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub
                  - arn:${AWS::Partition}:route53:::hostedzone/${ZoneId}
                  - ZoneId:
                      Fn::ImportValue: !Sub ${ZoneStackName}-HostedZoneId
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !Ref ProdDomainName
                      - !Sub _*.${ProdDomainName}
              - Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: '*'
              # /health (infra/site.cform.yaml): its function, which may only
              # run as its own role, log group, alarm topic, health checks and alarms.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt HealthFunctionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:uplink-health
              - Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/uplink-health
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/uplink-health:*
              - Effect: Allow
                Action: sns:*
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:uplink-health
              - Effect: Allow
                Action: cloudwatch:*
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:uplink-health-*
              # Health checks have no names to scope by.
              - Effect: Allow
                Action:
                  - route53:CreateHealthCheck
                  - route53:UpdateHealthCheck
                  - route53:DeleteHealthCheck
                  - route53:GetHealthCheck
                  - route53:ChangeTagsForResource
                  - route53:ListTagsForResource
                  - logs:DescribeLogGroups
                  - cloudwatch:DescribeAlarms
                Resource: '*'
              # The site template's AWS::LanguageExtensions transform
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions

  RcDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: uplink-github-deploy-rc
      Description: Assumed by GitHub Actions on *RC* tags and manual runs from main, to deploy the uplink release candidate (rc.uplink.nu01.com)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # *RC* tag pushes (X.Y.Z-RC1), and manual runs from main, in
                # either subject form (immutable IDs, or owner/name).
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubImmutableRepository}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepository}:ref:refs/tags/*RC*
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/uplink-rc-acm-cert/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/uplink-rc-web/*
              - Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStacks
                  - cloudformation:ListExports
                Resource: '*'
              # The site bucket, named after the stack (uplink-rc-web-sitebucket-...)
              - Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::uplink-rc-web-*
                  - arn:aws:s3:::uplink-rc-web-*/*
              - Effect: Allow
                Action: cloudfront:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:DeleteCertificate
                  - acm:ListCertificates
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                Resource: '*'
              - Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:GetHostedZone
                Resource: !Sub
                  - arn:${AWS::Partition}:route53:::hostedzone/${ZoneId}
                  - ZoneId:
                      Fn::ImportValue: !Sub ${ZoneStackName}-HostedZoneId
              # Records may change only for rc.uplink.nu01.com and its ACM
              # validation name (_<token>.rc.uplink.nu01.com): never prod's.
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub
                  - arn:${AWS::Partition}:route53:::hostedzone/${ZoneId}
                  - ZoneId:
                      Fn::ImportValue: !Sub ${ZoneStackName}-HostedZoneId
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !Ref RcDomainName
                      - !Sub _*.${RcDomainName}
              - Effect: Allow
                Action:
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource: '*'
              # /health (infra/site.cform.yaml): its function, which may only
              # run as its own role, log group, alarm topic, health checks and alarms.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RcHealthFunctionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:uplink-rc-health
              - Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/uplink-rc-health
                  - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/uplink-rc-health:*
              - Effect: Allow
                Action: sns:*
                Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:uplink-rc-health
              - Effect: Allow
                Action: cloudwatch:*
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:uplink-rc-health-*
              # Health checks have no names to scope by.
              - Effect: Allow
                Action:
                  - route53:CreateHealthCheck
                  - route53:UpdateHealthCheck
                  - route53:DeleteHealthCheck
                  - route53:GetHealthCheck
                  - route53:ChangeTagsForResource
                  - route53:ListTagsForResource
                  - logs:DescribeLogGroups
                  - cloudwatch:DescribeAlarms
                Resource: '*'
              # The site template's AWS::LanguageExtensions transform
              - Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions

  # Runs uplink-health: logs, reads the site's files and its certificate.
  HealthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: uplink-health
      Description: Runs uplink-health, the /health of uplink.nu01.com
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: health
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/uplink-health:*
              # The site bucket, named after the stack (uplink-web-sitebucket-...)
              - Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::uplink-web-sitebucket-*/*
              - Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*

  # Runs uplink-rc-health: logs, reads the site's files and its certificate.
  RcHealthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: uplink-rc-health
      Description: Runs uplink-rc-health, the /health of rc.uplink.nu01.com
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: health
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/uplink-rc-health:*
              # The site bucket, named after the stack (uplink-rc-web-sitebucket-...)
              - Effect: Allow
                Action: s3:GetObject
                Resource: arn:aws:s3:::uplink-rc-web-sitebucket-*/*
              - Effect: Allow
                Action: acm:DescribeCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:${AWS::Region}:${AWS::AccountId}:certificate/*

Outputs:
  DeployRoleArn:
    Description: Set as the repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  RcDeployRoleArn:
    Description: Set as the repository variable AWS_DEPLOY_RC_ROLE_ARN
    Value: !GetAtt RcDeployRole.Arn
  HealthFunctionRoleArn:
    Description: The role of uplink-health, imported by the uplink-web stack
    Value: !GetAtt HealthFunctionRole.Arn
    Export:
      Name: uplink-HealthFunctionRoleArn
  RcHealthFunctionRoleArn:
    Description: The role of uplink-rc-health, imported by the uplink-rc-web stack
    Value: !GetAtt RcHealthFunctionRole.Arn
    Export:
      Name: uplink-rc-HealthFunctionRoleArn
