# Sample use of the uplink action (action.yml at the repository root): checks
# https://prodbytes.substack.com for broken links every Monday, on demand, and
# on pull requests that change the action. The job fails when a link is
# broken, and the report is in the run's summary. On pull requests, which test
# the action rather than the site, the sample site's broken links don't fail
# the job; only an uplink error (exit code 2) or no result does.
#
# Other repositories use the action the same way, with
# `uses: prodbytes/uplink@main` and no checkout.
name: Check links

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        required: true
        default: https://prodbytes.substack.com
  pull_request:
    paths:
      - action.yml
      - scripts/run.sh
      - .github/workflows/check-links.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only needed here, to use the action from this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: uplink
        uses: ./
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          url: ${{ inputs.url || 'https://prodbytes.substack.com' }}
          args: --max-pages=500
      - if: github.event_name == 'pull_request'
        env:
          EXIT_CODE: ${{ steps.uplink.outputs.exit-code }}
        run: |
          echo "uplink exit code: ${EXIT_CODE:-none}"
          [[ "$EXIT_CODE" == 0 || "$EXIT_CODE" == 1 ]]
